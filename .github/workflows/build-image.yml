name: build-image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      beignet_version:
        description: "beignet npm version to bundle"
        required: false
        default: "latest"

env:
  IMAGE: ghcr.io/coreyphillips/beignet-app
  # The beignet npm version bundled in the image. Decoupled from the app tag,
  # since the app and the beignet library version independently.
  # 0.5.1 reports why a channel open failed rather than emitting the reason to
  # nobody; 0.5.2 attaches the channel id, so a failure can be tied to the open
  # it belongs to; 0.5.3 takes the funding fee rate on the open and prices an
  # on-chain transaction exactly (POST /tx/quote). The dashboard needs all three.
  # 0.5.4 is a large engine upgrade (channel splicing with quiescence, safer
  # sweep/justice handling, BOLT12 blinded reply paths, correct P2TR input
  # weights) with a byte-identical daemon surface: CLI, env config, HTTP routes
  # and openapi.json are unchanged from 0.5.3, verified by diffing the two
  # published tarballs, so the manager and UI need no changes.
  # 0.5.5 stops /health reporting "degraded" while a channel open, splice or
  # cooperative close is in progress; only established-but-broken channels
  # (or no peers for operational ones) degrade the wallet now.
  # 0.5.6 routes over our own channels when the gossip copy is missing our
  # channel_update, so paying a directly-connected peer over an announced
  # channel no longer fails with NO_ROUTE.
  # 0.5.7 prices splices (POST /channel/splice-quote): the daemon quotes the
  # fee and the largest fundable amount, so the dashboard's Max offers an
  # amount the coin selection will actually fund.
  # 0.5.8 accounts for splicing funds: getInfo/balance gain a splicing bucket
  # holding the POST-splice settle-to balance (the live channel balance stays
  # pre-splice until splice_locked), and channel listings carry
  # pendingSpliceLocalBalanceSats, so a wallet mid-splice never reads as empty.
  # 0.6.0 pays during splices: HTLC traffic flows straight through a splice's
  # confirmation window (ECDSA channels), mirrored onto both fundings, with
  # routing/forwarding/balances aware of the window and a unilateral exit on
  # whichever funding confirms. Verified live against real CLN on regtest
  # (11/11 splice-matrix interop, including four pay-during-splice cases).
  # 0.6.1 makes splices restart-proof: after the point of no return, recovery
  # and unilateral exit depend only on persisted material (session-free
  # adoption, batch re-signing, exact sig parameters stored with the sigs),
  # and taproot splices refuse cleanly on the wire instead of wedging.
  # 0.6.2 puts htlcUsable/payThroughSplice on the /channels wire (the CLI
  # serializer dropped them, re-parking mid-splice channels in the Send tab
  # while the daemon paid fine) and makes channel diagnostics splice-aware.
  # 0.7.0 makes channel opens work against dual-fund peers (openChannel routes
  # to the v2 protocol those peers require and auto-funds the interactive tx
  # from the wallet), fixes payment retry (retries never dispatched; a payee
  # one block ahead failed permanently; one inbound HTLC could re-forward on
  # every commitment round), counts pay-through-splice channels in /liquidity
  # (the card zeroed for the whole splice window), tears down opens whose
  # funding fails instead of stranding SENT_OPEN ghosts, adds a forwarding
  # opt-out (--no-forwarding / BEIGNET_FORWARDING_ENABLED; default stays ON so
  # umbrel nodes keep routing) with per-forward daemon logging, and carries the
  # BOLT 4 payloads on forwarding failures. Daemon surface is additive only:
  # existing routes, env and config unchanged.
  # 0.7.1 fixes three field findings from 0.7.0 testing: a REMOTE-initiated
  # cooperative close paid P2WPKH(funding_pubkey) — invisible to the wallet
  # until the startup recovery sweep — because the constructor never handed the
  # wallet sweep script to the channel manager; advertised htlc_maximum_msat /
  # htlc_minimum_msat derived from OUR config side (channels opened under the
  # old 500k in-flight default advertised a 500k per-HTLC ceiling for life,
  # refusing 1M sats on a 4M channel), now remote-derived and self-healing on
  # the next update refresh; and a payment offered at the sender's exact
  # spendable ceiling could force-close a healthy channel over sats-scale
  # margin disagreement — senders now keep an LND-style fee-spike buffer (2x
  # rate, spare HTLC slot, anchor outputs counted) and receivers price
  # affordability at the live commitment feerate. Daemon surface unchanged.
  # 0.7.2 makes beignet-to-beignet channel opens actually work: a plain
  # acceptor of a dual-funded (v2) open never took its interactive-tx turns,
  # so every beignet-to-beignet open deadlocked in DUAL_FUNDING_V2 (CLN
  # acceptors reply on their own, which is why interop never caught it). Max
  # funding is now supported on v2 opens too: the engine quotes the whole
  # balance minus the interactive-tx fee with the same weight formula the
  # channel uses, so the funding tx sweeps with no change output. Also fixes
  # mid-negotiation v2 channels listing an empty peerPubkey, which the
  # dashboard rendered as an unknown offline peer with a broken Reconnect.
  # Daemon surface: /channel/open additionally accepts max and satsPerVbyte
  # (parity with connect-and-open); everything else unchanged.
  # 0.7.3 adds trusted zero-conf channel opens for the dashboard's own-node
  # picker: connect-and-open accepts trusted, which puts the zero_conf channel
  # type (with its scid_alias dependency) on the wire (previously the bit was
  # never set, so zero-conf never actually negotiated), keeps the standard
  # v1/v2 routing (dual-fund peers ride open_channel2), and both peers
  # fast-track channel_ready so the channel is usable before the funding
  # confirms. Trusted channels are PERMANENTLY PRIVATE (BOLT 2 forbids
  # announcing a scid_alias channel type) and splices on them lock
  # immediately after tx_signatures. Reserves and everything else stay
  # standard BOLT 2. The acceptor must hold the opener in its trusted set
  # (POST /trusted-peer/add, which already existed) or it rejects the
  # proposal. Also fixes a pathfinding bug where an invoice hint naming an
  # announced channel could kill that exact route. Daemon surface:
  # connect-and-open additionally accepts trusted; everything else unchanged.
  # 0.7.4 is about channel funding surviving the ways it used to be lost. A
  # funding transaction that failed to broadcast is now retained and retried
  # until it confirms, rather than leaving a channel waiting on a transaction
  # no one has. Concurrent opens pledge their inputs and the selection is
  # serialised, so two fundings started close together can no longer pick the
  # same coin and double-spend each other. P2TR wallet inputs are signed on
  # the funding paths (BIP 341 prevouts), so a taproot UTXO can fund a
  # channel. A watchdog watches for a funding that never appears and voids the
  # channel rather than stranding it, and a request_funds of zero sats is
  # treated as no lease rather than a lease of nothing. Daemon surface: one
  # new route, POST /channel/funding-quote, which prices a funding against the
  # peer actually being opened to (v1 or v2 weights, rather than the v1 sweep
  # arithmetic the dashboard's Max preview reconstructs today, which is a few
  # sats out against a dual-fund peer). Nothing else changed: no env vars, no
  # CLI changes, and every existing route is byte-identical, verified by
  # diffing the published 0.7.3 and 0.7.4 tarballs' dist/cli. The dashboard's
  # Max preview on channel opens asks funding-quote for its figure; nothing
  # else needed changing.
  # 0.7.5 is one fix: the stuck-channel watchdog now measures how long a
  # channel has actually been disconnected. Its reestablish timer was only
  # reset when a channel first became ready, never after a successful
  # reconnect, so on a daemon that had been up a couple of weeks a routine
  # peer restart could be force closed on the very next block. That showed up
  # as the dashboard reporting a force close while the peer still listed the
  # channel as open and saw this node as merely offline. The timer now counts
  # contiguous blocks in the disconnected state, and the errored and
  # shutting-down timers got the same correction. Daemon surface: none. The
  # published 0.7.4 and 0.7.5 tarballs' dist/cli are byte-identical: no env
  # vars, no routes, no CLI changes.
  # 0.7.6 is one fix: GET /offers now includes each offer's encoded lno1
  # string. The encoding was stored beside every offer but only ever left
  # the daemon in the create response, so the list gave ids and metadata
  # and nothing a payer could use; the dashboard's offers table becomes
  # copyable against this version. Daemon surface: no new routes, env vars
  # or CLI changes; OfferInfo already declared encoded optional, the list
  # route now populates it. Verified by diffing the published 0.7.5 and
  # 0.7.6 tarballs' dist/cli (only beignet-node.js changed) and by driving
  # offer/create and /offers on a daemon booted from the 0.7.6 tarball.
  # 0.8.0 is a large release, 72 commits, and the headline for this app is that
  # BOLT 12 offers are payable between two beignet nodes at all. Through 0.7.6
  # the issuer generated a payment_secret, registered it as a receive-side
  # requirement, and then had no way to send it, because BOLT 12 defines no
  # such field; every offer paid to another beignet node failed with
  # incorrect_or_unknown_payment_details. Offers are now authenticated by the
  # blinded path's path_id, as the spec intends (beignet issue #252). Offers
  # also survive a restart now: they were an in-memory map, so a restart
  # emptied the list and made a shared offer unpayable. The rest is BOLT 12
  # payment correctness (retry context, blinded final payload validation, MPP
  # accounting by amt_to_forward, expiry sweeps), MPP routing fixes, on-chain
  # fee estimation fixes, and chain watcher teardown.
  #
  # Daemon surface: additive only, verified by diffing the published 0.7.6 and
  # 0.8.0 tarballs' dist/cli. One new route, DELETE /offer; none removed or
  # renamed. Two new env vars, BEIGNET_INSECURE and BEIGNET_METRICS_PUBLIC,
  # both opt-in and both unset here.
  #
  # The one behavior change worth naming is the HTTP hardening. GET /metrics
  # now sits behind auth, and the daemon refuses to start if it binds a
  # non-loopback host without auth, or enables wildcard CORS without auth.
  # None of that affects this app: the manager binds 127.0.0.1, always sets
  # BEIGNET_API_TOKEN, never enables CORS and never reads /metrics. The
  # request rate limiter also moved ahead of auth, but it stays opt-in and
  # nothing here configures it. Verified by booting a daemon from the 0.8.0
  # tarball with the exact env WalletManager spawns and driving every route
  # the dashboard calls: all present, all unchanged in shape.
  #
  # One 0.8.0 behavior change was worth reporting rather than absorbing, and
  # 0.8.1 below fixes it: a throw that was not one of the daemon's own typed
  # errors got scrubbed to a bare "Internal server error" with a stack trace
  # logged as an unhandled fault. The offer and BOLT 11 decoders throw plainly
  # on BAD INPUT, so a mistyped offer read as a daemon fault (beignet #269).
  #
  # 0.8.1 is those two follow-ups and nothing else. Unparseable invoice and
  # offer input now returns a typed 400, INVALID_OFFER or INVALID_INVOICE,
  # carrying the parser's own message, across all four entry points
  # (/offer/decode, /offer/pay, /invoice/decode, /invoice/pay-safe); a bad
  # paste no longer writes an unhandled-error stack to the wallet log. The
  # rate limiter also learned to honor X-Forwarded-For, but only from proxies
  # it has been explicitly configured to trust, which is the safe shape: doing
  # it unconditionally would let any direct caller spoof the header and skip a
  # limiter that deliberately runs ahead of auth to throttle credential
  # guessing. Nothing here configures the limiter, so that part is inert.
  #
  # Daemon surface: no new routes, no removed routes, no new or changed env
  # vars, verified by diffing the published 0.8.0 and 0.8.1 tarballs' dist/cli
  # (only beignet-node.js, daemon.js, errors.js and http-rate-limiter.js
  # differ). Verified again by booting 0.8.1 with the manager's env, driving
  # every route the dashboard calls, and confirming the four decode paths now
  # answer 400 with the parser's message and leave the log clean.
  # 0.8.2 landed here without a note: peerSupportsSplicing on /channels (the
  # dashboard hides splice buttons only on an explicit false), a mutual
  # local-and-remote capability check behind it, and on-chain transaction
  # events (transaction:received / transaction:confirmed) relayed over SSE,
  # which the dashboard's instant receive toasts ride.
  # 0.9.0 is a large release, the first since 0.8.2, and the reason it ships
  # here is one env var: BEIGNET_AUTO_RECONNECT (beignet #280). The manager
  # sets it false for on-chain only wallets, which silences the outbound half
  # of going quiet; without it the daemon dials its channel partners back on
  # start and the Edit dialog's parking promise is false. Parsing is exact
  # 'true'/'false', anything else means the default, reconnect on, the safe
  # direction for every other wallet. The engine's own headline is the
  # Recovery Protocol library plus a long run of lightning hardening (splice
  # unwind and reserve enforcement, v2 open RBF, hostile-peer decode guards).
  # Also relevant here: /info gains openChannelCount, channel info gains
  # closeStatus, channel:resolved is relayed over SSE (suppressed until the
  # close is confirmed), and POST /channel/rebroadcast-close lands, the set
  # requested in beignet #214 that part 2 of the channel history work waits
  # on; the dashboard does not consume any of it yet. L402 client routes
  # (POST /l402/fetch, GET /l402/credentials, DELETE /l402/credential) exist
  # and nothing here calls them. The Recovery Protocol has no daemon surface
  # yet, no env vars, routes or CLI, so there is nothing to wire. The CLI now
  # shuts down gracefully on SIGTERM with a bounded timeout, which is what
  # docker stop sends.
  # Daemon surface: additive only, verified by diffing the published 0.8.2
  # and 0.9.0 tarballs' dist/cli (one new env var, four new routes, nothing
  # removed or renamed; errors.js, webhooks.js and types.js byte-identical)
  # and by booting 0.9.0 with the manager's exact env in both postures:
  # on-chain only (no listen port, no reconnect, no dialing in the log) and
  # Lightning (every route the dashboard calls answers in the 0.8.2 shape,
  # and a garbage offer still decodes to a typed 400).
  # 0.9.1 is the fix for the field incident 0.9.0 caused on this app's own
  # node (beignet issue #437): inbound peer gossip was signature-verified
  # synchronously on the event loop with pure-JS secp256k1, so a peer
  # serving a full mainnet graph dump pinned the daemon for tens of
  # minutes; every route including /health starved, SIGTERM needed
  # SIGKILL, and the starved pings made peers reconnect and restart the
  # dump, a livelock that recurred on every boot and spread between
  # wallets when they reconnected. Diagnosed by pausing the live wedged
  # daemon through the inspector: all five stack samples sat in gossip
  # signature math. Fixed twofold: the graph refuses to pay for signatures
  # on messages that cannot change it (a re-served known graph costs map
  # lookups), and broadcast gossip drains through a bounded queue in 10ms
  # slices that yield to the event loop, with updates for our own channels
  # kept synchronous. Expect the FIRST boot on an established node to chew
  # its peers' full dump in the background for a while; the dashboard
  # stays responsive throughout and later re-dumps cost nearly nothing.
  # 0.9.1 also ships the Recovery Protocol daemon surface (issue #435):
  # env vars BEIGNET_RECOVERY_MODE / _GUARDIANS / _PROFILE, GET
  # /recovery/status, POST /recovery/restore, a recovery CLI command and
  # six recovery:* SSE events. All of it is inert here: nothing sets the
  # env vars (mode defaults to off) and the status route answers state
  # "disabled", which is exactly the capability probe the future recovery
  # UI will use.
  # Daemon surface: additive only, verified by diffing the published 0.9.0
  # and 0.9.1 tarballs' dist/cli (three new env vars, two new routes,
  # nothing removed or renamed) and by booting 0.9.1 with the manager's
  # exact env in both postures: on-chain only binds only the API and
  # /recovery/status answers 200 disabled; Lightning answers every route
  # the dashboard calls in the 0.9.0 shape with the typed 400s intact.
  BEIGNET_VERSION: "0.9.1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          BEIGNET="${{ github.event.inputs.beignet_version || env.BEIGNET_VERSION }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "beignet_version=$BEIGNET" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BEIGNET_VERSION=${{ steps.meta.outputs.beignet_version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
