name: build-rbitcoin-image

# The image for the beignet-rbitcoin app: rbitcoin's own static release
# binary on Alpine (docker/rbitcoin/Dockerfile). Published on a tag of the
# form rbitcoin-v<rbitcoin version>-<app patch>, such as rbitcoin-v0.8.0-1,
# as ghcr.io/coreyphillips/rbitcoin:0.8.0-1. The app patch lets a packaging
# fix ship without a new upstream release (0.8.0-2); a new upstream release
# starts the patch over (0.8.1-1). The tag's version is also the app's
# `version` in umbrel-app.yml, so check-release's tag-equals-version rule
# holds for this app as it does for beignet-wallet.
on:
  push:
    tags:
      - "rbitcoin-v*"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/coreyphillips/rbitcoin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#rbitcoin-v}"
          else
            VERSION="dev"
          fi
          # The Dockerfile is the one place the rbitcoin release, its
          # checksum and the base image are pinned; read them from there so
          # the tag cannot claim a release the binary is not.
          RB=$(sed -nE 's/^ARG RBITCOIN_VERSION=(.+)$/\1/p' docker/rbitcoin/Dockerfile)
          SHA=$(sed -nE 's/^ARG RBITCOIN_NODE_SHA256=([0-9a-f]{64})$/\1/p' docker/rbitcoin/Dockerfile)
          ALPINE=$(sed -nE 's/^ARG ALPINE_IMAGE=(.+)$/\1/p' docker/rbitcoin/Dockerfile)
          if [ -z "$RB" ] || [ -z "$SHA" ]; then
            echo "::error::docker/rbitcoin/Dockerfile must pin RBITCOIN_VERSION and a 64-hex RBITCOIN_NODE_SHA256"; exit 1
          fi
          case "$ALPINE" in
            alpine:*@sha256:*) ;;
            *) echo "::error::docker/rbitcoin/Dockerfile must pin ALPINE_IMAGE to a tag and digest, got '$ALPINE'"; exit 1 ;;
          esac
          # The tag must be exactly the pinned release plus a numeric app
          # patch: rbitcoin-v0.8.0 or rbitcoin-v0.8.0-beta would publish a
          # version the release-notes check later refuses, and :latest with it.
          if [ "$VERSION" != "dev" ] && ! printf '%s\n' "$VERSION" | grep -qE "^$(printf '%s' "$RB" | sed 's/\./\\./g')-[0-9]+$"; then
            echo "::error::tag $GITHUB_REF_NAME must be rbitcoin-v$RB-<app patch>, the release the Dockerfile pins plus a number (for example rbitcoin-v$RB-1); got $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rbitcoin=$RB" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/arm64 carries a stub, not the node (see the Dockerfile): the
      # app then installs on a Raspberry Pi Umbrel and its page says why the
      # node is not running, instead of the pull failing with no explanation.
      # The source label links the package to this repository on GHCR, so the
      # package shows up under it and takes its access permissions. It does
      # not make the package public: a package first published under a
      # personal account is private until its visibility is changed by hand
      # (beignet-rbitcoin/README.md, Releasing).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rbitcoin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/coreyphillips/beignet-umbrel
            org.opencontainers.image.description=rbitcoin ${{ steps.meta.outputs.rbitcoin }} for the beignet-rbitcoin Umbrel app
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
