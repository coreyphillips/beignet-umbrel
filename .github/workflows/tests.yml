name: tests

# The manager's server tests and the dashboard's tests and build, on every
# pull request and on every push to main. Nothing else in this repo runs
# them: build-image.yml only builds, and docker/Dockerfile never tests.
#
# Both jobs run on the Node release the app image runs, read from the
# NODE_IMAGE line in docker/Dockerfile, so the tests cannot drift from the box.
# (The manager's test script passes a glob to `node --test`, which the test
# runner only accepts from Node 21 on.)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  manager:
    name: manager server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v4
      - name: Node release of the app image
        id: node
        working-directory: .
        run: |
          VERSION=$(sed -nE 's/^ARG NODE_IMAGE=node:([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/p' docker/Dockerfile)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: manager/package-lock.json
      - run: npm ci
      - run: npm test

  ui:
    name: dashboard tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager/ui
    steps:
      - uses: actions/checkout@v4
      - name: Node release of the app image
        id: node
        working-directory: .
        run: |
          VERSION=$(sed -nE 's/^ARG NODE_IMAGE=node:([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/p' docker/Dockerfile)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: manager/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
