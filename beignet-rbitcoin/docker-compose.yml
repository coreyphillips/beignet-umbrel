version: "3.7"

services:
  app_proxy:
    environment:
      # The status page, by pinned container name for the same reason
      # beignet-wallet pins its manager (see that compose file): a derived
      # name depends on the compose binary, and app_proxy waits forever on a
      # name that does not resolve.
      APP_HOST: beignet-rbitcoin_web_1
      APP_PORT: 80

  node:
    # Pinned so Beignet's preset and the status page can address this
    # container by name on the shared umbrel_main_network. Fixed IPs (the
    # official apps' choice) need an address nobody else on 10.21.21.x uses,
    # which a community app cannot verify; a name needs nothing.
    container_name: beignet-rbitcoin_node_1
    # Tag is <rbitcoin release>-<app patch> and equals `version` in
    # umbrel-app.yml, so a packaging fix can ship without a new upstream
    # release (0.8.0-2) and check-release's tag-equals-version rule holds. The
    # digest proves the build exists (see check-release).
    image: ghcr.io/coreyphillips/rbitcoin:0.8.99-2@sha256:7e38f04c385efa86df0985bfb90f72b2e0a882e2468b9b5d94ebbf12fbe13659
    restart: on-failure
    init: true
    # rbitcoin flushes its store on SIGTERM and its docs say a kill is "not a
    # schema upgrade": a store killed mid-flush resumes, but a clean stop is
    # what every upgrade path assumes. Mid-sync a flush can take minutes on a
    # home SSD, so the grace period is long. The smoke test measures a regtest
    # stop; revisit after the first mainnet sync on real hardware.
    stop_grace_period: 15m
    volumes:
      # Hundreds of GiB. Excluded from Umbrel backups by backupIgnore in the
      # manifest; it rebuilds from the network.
      - ${APP_DATA_DIR}/data:/data
      # Saved defaults survive updates and stay separate from chain data.
      - ${APP_DATA_DIR}/settings:/settings
      # The status page, written here by this image's entrypoint on every
      # start and read by the web container below. It lives in the image
      # (docker/rbitcoin/web) because umbrelOS copies app files into
      # APP_DATA_DIR at install and, on update, only docker-compose.yml,
      # *.template, exports.sh, torrc and hooks: a page shipped as app files
      # would stay at its install version for the life of the app.
      - ${APP_DATA_DIR}/web:/web
    # Electrum on the home network. 50001 (Electrs), 50002 (Fulcrum) and 50003
    # (ElectrumX) are taken on the host by the official apps, so this one
    # publishes 50011 (unused in getumbrel/umbrel-apps as of October 2026).
    # Plain TCP, no TLS: rbitcoin does not terminate TLS and this is for the
    # home network. The health port (9332) stays unpublished: it is
    # unauthenticated, and the status page reaches it over the Docker network.
    ports:
      - "${APP_RBITCOIN_PUBLIC_PORT:-50011}:50001"
    environment:
      # Docker's default seccomp profile blocks io_uring_setup (moby/moby
      # #46762). rbitcoin would demote itself to pread when the setup call
      # fails; saying so explicitly makes the IO path the same on every box
      # and keeps a future profile change from silently changing it.
      RBITCOIN_IO: pread
      # Stamped into /web/.version after the page is copied; the web
      # container waits for its own version to appear there, so a start
      # right after an update never renders the previous version's page.
      APP_VERSION: "${APP_VERSION:-dev}"
    # Network, data paths, indexing and bindings stay fixed here. The dashboard
    # saves peer, mempool and logging defaults in /settings. The launcher adds
    # them before these arguments, so explicit compose flags take precedence.
    #   --network mainnet      the upstream default --milestone (840000)
    #                          applies: script checks start at that block;
    #                          add "--milestone", "0" for full validation
    #   --sh-index             address history, which every wallet needs
    #   --electrum-listen      all interfaces inside the container; the ports:
    #                          mapping above decides who reaches it
    #   --health-listen        all interfaces inside the container, for the
    #                          status page; never published
    #   --metrics              block and header heights on /metrics of that
    #                          listener, which the status page reads for the
    #                          percentage during the first sync (/progress
    #                          names only the phase then)
    # Saved limits initially match upstream defaults. Dashboard changes take
    # effect after restarting the app in Umbrel.
    command:
      - --datadir
      - /data
      - --network
      - mainnet
      - --sh-index
      - --electrum-listen
      - "0.0.0.0:50001"
      - --health-listen
      - "0.0.0.0:9332"
      - --metrics

  settings:
    container_name: beignet-rbitcoin_settings_1
    # The same release image runs only the settings API as uid 1000.
    image: ghcr.io/coreyphillips/rbitcoin:0.8.99-2@sha256:7e38f04c385efa86df0985bfb90f72b2e0a882e2468b9b5d94ebbf12fbe13659
    restart: on-failure
    init: true
    command: ["settings-server"]
    volumes:
      - ${APP_DATA_DIR}/settings:/settings
    # No published port, Docker socket, chain data, or restart access.

  web:
    # Pinned because app_proxy addresses it by name.
    container_name: beignet-rbitcoin_web_1
    # The official nginx image renders the template directory's *.tmpl files
    # with envsubst at start, which is all the templating the status page
    # needs: static assets poll node health through /node/ and save defaults
    # through /api/settings. No frontend build or external assets are needed.
    image: nginx:1.30-alpine@sha256:c59d1f8b1e0e42da75be973424cd72e23f7f8adfb54e982f4d1cd0216a5a5576
    restart: on-failure
    depends_on:
      - node
      - settings
    volumes:
      # The directory the node fills on every start (see its volumes). The
      # template keeps the .tmpl suffix rather than .template so umbrelOS's
      # own unfiltered envsubst pass over *.template never touches it (it
      # would blank nginx's $uri and friends); it is not among the app files
      # anyway, but the suffix says so.
      - ${APP_DATA_DIR}/web:/web:ro
    # The image's entrypoint runs its setup scripts (envsubst among them)
    # only when the command starts with "nginx", so the wait runs first and
    # then hands over to the entrypoint for real. The node writes the stamp
    # last, after the page; waiting for it to name this version means the
    # template rendered below is the one that shipped with the node image
    # now running, never the one from before an update.
    command:
      - /bin/sh
      - -c
      - 'until [ "$$(cat /web/.version 2>/dev/null)" = "$$APP_VERSION" ]; do sleep 1; done; exec /docker-entrypoint.sh nginx -g "daemon off;"'
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /web/templates
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .tmpl
      # Only these names are substituted; nginx's own variables survive.
      NGINX_ENVSUBST_FILTER: "^(LAN_HOST|PUBLIC_PORT|APP_VERSION|NODE_HOST|SETTINGS_HOST)$$"
      # umbrelOS exports DEVICE_DOMAIN_NAME (hostname.local). There is no LAN
      # IP variable, so the page also says "or your Umbrel's IP address".
      LAN_HOST: "${DEVICE_DOMAIN_NAME:-umbrel.local}"
      PUBLIC_PORT: "${APP_RBITCOIN_PUBLIC_PORT:-50011}"
      APP_VERSION: "${APP_VERSION:-dev}"
      NODE_HOST: beignet-rbitcoin_node_1
      SETTINGS_HOST: beignet-rbitcoin_settings_1
