releaseNotes: >-
  Changing a lightning-first wallet's primary no longer strands its old
  channel. The Overview lists "Channel with your previous primary" with
  its balance until it is gone, and "Move funds to the new primary"
  closes it cooperatively so the funds carry into the new home channel
  once the close confirms. The Edit dialog says so when you pick a new
  primary.


  Close says what happens next. Closing the home channel returns the
  funds on-chain, and a lightning-first wallet would move them straight
  back into a channel with its primary after one confirmation. The
  close modal now says so and offers "Close and turn lightning-first
  off" as one action, which switches the wallet first so the payout
  stays on-chain.


  The Send tab explains arriving funds. When an invoice asks for more
  than Can send but no more than Total, the Lightning card says what is
  on its way (a deposit waiting to confirm, a confirmed deposit waiting
  to move, a channel funding or splice not yet confirmed) and what that
  means for this payment, and keeps the invoice in the box so you can
  retry without pasting it again. A primary that is not connected is
  refused before an invoice is created, not after.


  Also fixed: a lightning-first wallet's Send tab opened on the address
  rail while its channel list was still loading. beignet 0.11.0 remains
  bundled.


