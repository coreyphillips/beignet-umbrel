releaseNotes: >-
  Channel backup. Every Lightning wallet now chooses what it keeps
  beyond the seed: nothing (channels close on restore, the default),
  encrypted checkpoints with the peers it has channels with, or an
  encrypted journal on three guardian servers you set once in
  Settings. With guardians, importing the seed elsewhere restores
  the channels and resumes them instead of closing them, and strict
  quorum mode fences the old device off so two copies can never act
  on the same channels. The Overview tab states the tier plainly, and
  the wallet header speaks up only when something is wrong.


  Restoring from guardians is a page, not a procedure: import the
  seed with the same guardians and the wallet offers the restore,
  follows each step, then follows each channel as it reconciles with
  its peer. A channel that cannot prove its state is current closes
  safely and its funds return on-chain, and the page says so rather
  than reporting an error.


  Peer storage checkpoints recover the funds of a lost wallet's
  channels (the channels close safely); resuming them where they
  were waits on the engine. beignet 0.9.3 is bundled.


