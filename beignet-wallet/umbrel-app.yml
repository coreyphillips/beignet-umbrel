releaseNotes: >-
  Bundles beignet 0.23.1, a fix release. Completed payments older than a day
  no longer drop out of the history a minute after the node starts, and their
  requests stay marked paid. A force-closed channel's swept balance is no
  longer counted twice while the channel is still winding down, and a
  channel close or sweep is paid to an address the wallet never handed out,
  so a saved receive request is no longer shown as partly paid by a close.
  Receiving over a just-in-time channel works when the wallet also has a
  channel with another peer. A payment whose route hop raised its fee is
  retried at the new fee instead of losing the hop, and a wallet with one
  usable channel keeps it on the retry. Channels report the transaction of a
  splice in progress and the fundings a splice replaced, so the wallet's own
  deposits into its channel read as transfers rather than sends, and a
  broadcast that the network refuses now says which transaction and whether
  the wallet keeps retrying it.


