releaseNotes: >-
  Bundles beignet 0.39.0, and adds Relay only to the Iroh phone link.


  Relay only is a checkbox under the Iroh phone link in each wallet's
  "Connect to this node" card. With it on, every connection made through
  the link stays on the relay, so whoever holds the link cannot learn this
  Umbrel's IP address from it and the link can be handed to someone else.
  The relay's operator still sees the address, which is n0 with the default
  relays. It is off by default, and turning it on or off restarts the
  wallet.


  What it costs: a payment takes about 80 ms longer, and the link comes up
  about 12 seconds later after each restart. If your router opens a port
  for the link, the link switches itself off instead of offering that
  address, and the card says why. A phone that connected before you turned
  it on keeps the address it learned until its app is restarted.


  Chicory 0.7.18 and Chicory Desktop 0.3.6 connect through such a link as
  they are.


  Also from the engine: in Tor mode, peers reached over WebSocket are now
  dialed through Tor as other peers are, and a peer that stops answering
  pings is dropped after 60 seconds.


  Going back to 0.39.0 keeps the wallet storage, which is unchanged. That
  version does not know Relay only and offers the same link with direct
  connections again, so turn the Iroh phone link off before going back if
  the link has been handed out.
