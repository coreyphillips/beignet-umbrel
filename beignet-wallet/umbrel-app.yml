releaseNotes: >-
  Bundles beignet 0.43.5. An asset payment that a peer sends with too
  little bitcoin to keep an output of its own, under the channel's dust
  limit, no longer closes the channel: the wallet refuses it, drops the
  connection and dials the peer again, and the channel is back once the
  peer stops trying. Beignet 0.43.4 closed such a channel by force. A peer
  that runs Lightning Labs' daemons sends one only when whoever pays
  through it hands it the units for the first hop. Going back to app
  0.42.2 keeps your wallets and channels, asset channels included.


  From app 0.42.2: Asset channels with a peer that runs Lightning Labs'
  daemons. An invoice
  of yours now names that peer with its own fee and CLTV delta for the
  channel, as tapd's own invoices do; before, a payer reaching you through
  such a peer could be refused there once and have to try again. A channel
  such a peer opens to your wallet was tried on regtest and works: the peer
  funds it from units your wallet sent it, and your side starts with only
  the bitcoin the peer pushed, none by default, so you can pay through it
  once about five payments have come in. An open to Lightning Terminal
  older than v0.17.11, which always ends before anything is funded, now
  says so, where it said the peer turned the channel down. Going back to
  app 0.42.1 keeps your wallets and channels, asset channels included.


  From app 0.42.1: bundles beignet 0.43.4. A sweep of a bitcoin channel's
  output, after a channel was closed by force, now pays at least the fee
  rate it was built at: the engine prices it from the size of the
  transaction it builds. A
  wallet's own share used to pay a little under that rate, so at 1 sat/vB
  some nodes turned it away until the wallet raised the rate six blocks
  later. The sweeps of an asset channel are priced as before.


  From app 0.42.0, if you are updating from 0.41.0: Taproot Assets, assets
  that live on bitcoin, held and sent from the same wallets.


  Each wallet can now create an asset (a coin with decimals, or a
  collectible), receive one at an address of its own, send it, and burn it.
  An asset sits on a bitcoin output of about 1,000 sats, which the wallet
  keeps out of its spendable balance and shows as locked with assets. The
  proofs that an asset is what it says travel through a proof server,
  Lightning Labs' universe by default; a send whose proof the server will
  not carry can be handed over as a file, and the recipient imports it.
  Back up again after you create or receive an asset: Settings, Backups
  marks a wallet whose assets changed since the last archive.


  Asset channels. A wallet with Lightning can open a channel funded with an
  asset to a peer that takes asset channels, another wallet of this app or a
  node running Lightning Labs' lnd with tapd (Lightning Terminal v0.17.11 was
  tried, on regtest). Over it the wallet pays an invoice with the asset and
  makes invoices that are paid in the asset. A channel holds one issuance of
  one asset, at most eight payments in flight each way, and about 100,000
  sats of bitcoin beside the asset: every payment moves 355 sats of it to
  the one who is paid, so a side that has paid many times without being paid
  can run out, and the channel says so. Closing together brings both sides'
  assets and bitcoin back on-chain at once; a force close waits out a delay
  of 144 blocks.


  Asset channels need confirmed bitcoin beside them on native SegWit
  addresses, at least one coin of about 35,000 sats on mainnet. From it the
  wallet makes fee coins when a payment caught in a channel closed without
  its peer has to be claimed on chain. The fee coins the claims leave over
  go back to the spendable balance about 100 blocks after the last claim.


  Not covered yet: forwarding a payment with an asset leg, a payment in
  several parts, more than one asset in a channel, and a backup restore that
  brings back the assets of a channel that was open. Guardian backups and
  asset channels do not go together.


  Also from the engine: a force close with no payment in flight bids the
  network's current fee rate, where it bid at least 10 sat/vB, and a wallet
  reads Electrum servers that answer transactions only in raw form. The
  public Electrum servers that answer every lookup the wallet makes are now
  offered first.


  Going back to app 0.41.0 keeps your wallets and channels. It does not show
  assets, and it lists a payment an asset channel carried as an ordinary
  bitcoin payment. It starts a wallet that has an asset channel open but
  leaves that channel out, so nothing answers its peer or watches the chain
  for it until this version is back. Close every asset channel, and wait for
  the assets to be back on-chain, before going back.
