releaseNotes: >-
  Any beignet node can now be a recovery guardian. Tick "Serve as a
  guardian for other beignet nodes" on a Lightning wallet (create form
  or Edit) and its daemon hosts the guardian at the wallet's own
  Lightning address, over Tor when the wallet announces one. Other
  beignet wallets pin it as one of their three guardians and keep an
  encrypted journal of their channel state there, which this node
  cannot read. The Overview tab gains a card with what it holds, how
  much, and the address to hand out.


  Adding a guardian got simpler: paste a node's Lightning address
  (<node id>@host:port) into a guardian slot in Settings and it
  resolves to a guardian entry, or pick a serving wallet from this
  Umbrel. Three independent operators is the point, so pair with other
  Umbrels; a wallet on the same box protects against nothing this box
  can suffer. A wallet still pins the set it first registers with and
  cannot move to another, so choose guardians you expect to keep.


  Settings also keeps a partial guardian list now, so a set can be
  collected one node at a time; a wallet needs all three before it can
  turn a guardian mode on.


  A serving wallet keeps answering guardian traffic even while its own
  channel backup is waiting for its guardians to confirm it, so a group
  of Umbrels guarding each other can all restart at once. This bundles
  beignet 0.12.0.


