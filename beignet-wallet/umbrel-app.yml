releaseNotes: >-
  Bundles beignet 0.33.0. Beignet's own Lightning feature bits move to a range
  no other implementation uses: the old ones sat on bits that eclair and the
  bLIP-2 registry had taken, so a connection to an ACINQ node dropped right
  after the handshake. Offline receiving and async receive grants now need
  both sides on this release, so update a Chicory phone paired with this
  Umbrel to 0.7.5 at the same time; a wallet still talking to an older peer
  keeps its channels and payments working but cannot set up new offline
  receive epochs with it until both are current.


  A payment that arrived through a JIT channel open now shows what the wallet
  was credited, with the opening fee as its fee. A coin spent from an old
  address now shows in Activity without a rescan, a received payment on a
  closing channel is claimed on time even after a restart, and background
  wallet refreshes and node startup use less memory.


  Going back to 0.32.6 keeps the wallet storage, which is unchanged, but
  brings back the old feature bits.
