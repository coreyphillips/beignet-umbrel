releaseNotes: >-
  Bundles beignet 0.24.1, a hardening release for Lightning payments. An
  incoming payment is now accepted only once it is irrevocably committed on
  both sides of the channel, so it can no longer be counted on an update the
  peer could still take back. After a restart, a reconnect or an interrupted
  splice, the node finishes settling any incoming payment it had already
  completed. Outgoing retries are more careful: a payment that failed for
  good is reported as failed, a retry no longer undoes one already in hand,
  and a timed-out part of a multi-part payment is failed back once the
  channel allows it. BOLT 12 offers and invoices that ask for unsupported
  features are refused before anything is sent, and peers asking for an
  excessive delay on a new channel are refused. Database backups written by
  the node now carry a checksum keyed from the wallet seed, which a restore
  verifies. Guardian hosting, coin freezes during a funding pledge and
  automatic rebalances also get fixes.


