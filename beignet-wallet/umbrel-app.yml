releaseNotes: >-
  Bundles beignet 0.21.4, a wallet history fix. A transaction that a chain
  reorg undid no longer sits in your history as confirmed at a block the
  chain no longer has. It goes back to unconfirmed, keeps its place in
  Activity, and is watched until it confirms again or stops existing. It
  lands there whether your Electrum server reports the transaction with no
  confirmations or, on a server without a transaction index, reports it as
  gone.


  A refresh no longer reads a busy or failing Electrum server as an answer
  about where a transaction is: the wallet keeps what it already knows and
  asks again on the next refresh. A transaction left out of a lookup that
  failed keeps its record too, so one bad batch no longer stops the wallet
  watching it for a reorg.


  A lightning-first wallet waits on a deposit a reorg undid rather than
  opening a channel on it.

