releaseNotes: >-
  This release unsticks wallets that vanished into loading skeletons
  after 0.12.0. The cause was in the engine: a peer sending the full
  network graph was checked signature by signature on the daemon's
  only thread, which could freeze a wallet for good on modest
  hardware, and one frozen wallet then blanked the whole dashboard.
  beignet 0.9.1 does that work in small slices off to the side and
  skips signatures that prove nothing new, so the first start after
  this update may quietly chew through its peers' graph for a while,
  with the dashboard responsive throughout.


  The dashboard takes its own lesson: one unresponsive wallet can no
  longer take the page down with it. Its row stays, its live figures
  wait, and everything else renders. The manager also keeps checking
  wallet health after startup instead of trusting the first hello
  forever, so an unresponsive wallet is now reported as exactly that.


  And a wallet whose daemon was force-killed before an update can no
  longer refuse to start afterward over its own leftover lock file:
  the manager clears a lock that provably belongs to a previous
  container before starting the wallet.

