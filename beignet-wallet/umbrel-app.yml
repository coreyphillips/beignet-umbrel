releaseNotes: >-
  Lightning-first wallets now prepare Lightning invoices for offline payment
  automatically. Create an invoice, stop the wallet, and payments appear in
  your balance and history when you reopen it. Unpaid invoices stay payable
  through restarts until they expire, and reopening does not duplicate payments.


  Regular Lightning wallets gain a "Receive offline" checkbox in the invoice
  form, off by default. Enter at least 354 sats to enable it, choose a connected
  receiving node, and review its fee before creating the invoice. Leaving it
  off preserves ordinary receiving, including invoices where the payer chooses
  the amount. Changing the option requires a new invoice; already shared
  invoices stay unchanged.


  The receiving node must support offline receiving and stay available to
  settle payments. Providers can explicitly enable channel funding with
  cumulative limits. Existing spendable balances are kept available, and
  recovery never force closes a channel automatically. Manual voucher books
  remain under Advanced offline receive. Bundles beignet 0.21.9.


