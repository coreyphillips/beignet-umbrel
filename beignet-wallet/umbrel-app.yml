releaseNotes: >-
  Bundles beignet 0.35.1, which brings Beignet 0.34.0 and 0.35.0. A channel
  force closed while its peer was offline is no longer force closed again on
  every block, and a payment through it is no longer marked failed before
  the chain has settled it.


  When a channel open fails because the connection dropped, the error now
  says which side closed the connection and why, and a peer that aborts a
  channel transaction with a reason has that reason shown in the channel's
  history and the Logs tab. Peer connections, disconnections and channel
  opens are now logged at the default level. The engine also keeps a record
  of each direct-funding payment the wallet receives, which API clients can
  read.


  Going back to 0.33.0 keeps the wallet storage, which is unchanged, but
  direct-funding payments received after going back are not recorded.
