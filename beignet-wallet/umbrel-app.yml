releaseNotes: >-
  A brief disconnect is not a reason to close a channel.


  The engine carries a safety net that force closes a channel stuck
  waiting to reconnect for about two weeks, and its timer was only ever
  reset when a channel first opened, never after a successful reconnect.
  So on a node that had been up for a while, a routine restart of the
  other side could be answered with an immediate force close. You saw it
  as a channel this wallet called force closed while the other node
  still listed it as open and thought this one was merely offline. The
  timer now measures how long the channel has actually been disconnected
  this time, so the safety net fires only for the two-week outages it
  was built for.


  The Max preview when opening a channel is now priced by the wallet
  engine against the peer you are opening to, so the figure shown is the
  figure that funds, whichever open protocol the peer speaks.


  Ships beignet 0.7.5, which contains the watchdog fix and nothing else:
  the daemon surface is unchanged from 0.7.4.

