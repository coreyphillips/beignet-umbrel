releaseNotes: >-
  Bundles beignet 0.40.0, and says what Relay only does not cover.


  Relay only keeps the Iroh phone link on the relay, so the link itself
  does not give away this Umbrel's IP address. The link also carries the
  wallet's Lightning node id, and anything that ties that id to an address
  undoes Relay only from outside the link. The card now warns under the
  link when the wallet announces a public address, and when it is in
  Clearnet or Hybrid mode, where the peers you connect it to see the
  address. The dialog that turns Relay only on lists both, and adds that a
  Lightning port which can be reached from the internet (a router forward,
  or IPv6) lets the node be found without the link.


  Before handing a link out, and above all before posting one publicly,
  go through the list in docs/IROH.md: Tor mode, a node id that never
  announced a public address, and a Lightning port that cannot be reached
  from outside. The relay's operator still sees the address in every case.


  From the engine: a wallet set to Relay only no longer dials out over
  Iroh, because the relay of the peer it dialed would see this Umbrel's
  address. The dashboard never made such a dial; it could only be asked
  for through the wallet's API. Phones and peers that connect in through
  the link are not affected. Where the link cannot come up because the
  app's container has no IPv6 loopback address, the card now names the
  cause and the setting that restores it.


  Going back to app 0.40.0 keeps the wallet storage, which is unchanged.
  That version has neither the warnings nor the engine's dial rule.
