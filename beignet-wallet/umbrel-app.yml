releaseNotes: >-
  Bundles beignet 0.38.3, and adds LNURL and Paykit to each wallet's Tools
  tab. The Send tab looks the same, but now also takes Lightning addresses,
  LNURLs and pubkys, and works out the rest.


  LNURL: pay a Lightning address or an LNURL-pay link, pull sats from an
  LNURL-withdraw link, and log in to sites that support LNURL-auth with a
  key derived from the wallet's seed.


  Paykit: press Set payment details and the wallet publishes how to pay it
  (a Lightning offer, an address and, for a lightning-first wallet, a direct
  funding request) under a pubky that comes from its seed, so there's
  nothing new to back up. Any other Beignet wallet can then pay that pubky
  from the Send tab, by direct funding, Lightning or on-chain. Keep these up
  to date publishes again when something changes, and Use in Pubky Ring
  shows the phrase for importing the same pubky there. What a wallet
  publishes is public, and there's no way to take it down from here yet.


  These are the only web requests the app makes on its own, and they follow
  each wallet's network mode: a Tor wallet sends them through Umbrel's Tor
  and fails rather than going direct when Tor is down.


  A primary can now pay its own lightning-first wallet's BOLT 12 offer,
  which failed before.


  Going back to 0.38.2 keeps the wallet storage, which is unchanged.
  Published Paykit details stay up but stop being refreshed.
