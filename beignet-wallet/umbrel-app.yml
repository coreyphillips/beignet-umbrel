releaseNotes: >-
  An offer you create is an offer you can share.


  Creating a BOLT12 offer used to end in a toast and a cleared form:
  the offer existed, but nothing on screen could show or copy it. The
  create card now presents the offer the moment it is made, as a QR
  code and a copy row, and the Your offers list carries the full
  offer string for every entry, so any offer can be copied again
  later.


  One honest caveat: offers currently live in daemon memory, so a
  wallet restart clears the list and retires previously shared
  offers. Making them durable is tracked upstream and will ship in a
  future release.


  From the previous release: every count of channels is a count of
  open channels. The overview's Channels tile and the Liquidity
  card's active figure now count only channels that still operate,
  so a wallet whose channels have all closed says zero instead of
  claiming them forever.


  Ships beignet 0.7.6, whose one change is the daemon's offer list
  including each offer's encoded form.

