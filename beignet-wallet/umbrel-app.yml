support: https://github.com/coreyphillips/beignet/issues
gallery:
  - https://raw.githubusercontent.com/coreyphillips/beignet-umbrel/main/beignet-wallet/gallery/1.png
  - https://raw.githubusercontent.com/coreyphillips/beignet-umbrel/main/beignet-wallet/gallery/2.png
  - https://raw.githubusercontent.com/coreyphillips/beignet-umbrel/main/beignet-wallet/gallery/3.png
releaseNotes: >-
  Bundles beignet 0.26.0 and adds an experimental Iroh phone link for pairing
  Chicory with your own node without forwarding a port. Enable the phone link
  in a wallet's Network settings, then scan or copy its Iroh pairing address
  into Chicory's primary node settings. The link is off by default and can be
  used alongside Clearnet, Tor or Hybrid. Direct peers and relays can see your
  IP address. Defaults use n0 public relays and endpoint discovery; choosing
  custom relays disables n0 discovery. Existing network modes stay available.


  Also includes concurrent offline receive books from beignet 0.25.0, with
  negotiated receive capacity, durable requests and signed receipt tracking.
  This release includes validation and pairing fixes, including a copyable
  address when a custom relay URL is too long for a QR code.


