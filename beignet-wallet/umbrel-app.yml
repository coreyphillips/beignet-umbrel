releaseNotes: >-
  Offline receive gains witnesses and an issuer. A sibling wallet that
  stays online can now keep an encrypted receipt of every payment made to
  a wallet's vouchers while it is off, so what was paid is collected even
  if the settlement peer disappears. Turn on "Keep receipts for sibling
  wallets receiving offline" in that wallet's Edit dialog, give it a
  public channel to the settlement peer, and tick it as a witness when
  starting a book on the Receive tab. Payments then route through the
  witness, and the panel above the tabs says what each witness answered
  when the wallet returns.


  The same sibling can issue invoices to payers who hold none. Turn on
  "Issue invoices for sibling wallets receiving offline" as well, pick it
  as the issuer when starting the book, and the Receive tab shows a BOLT
  12 offer to share instead of invoices: a payer who scans it asks the
  issuer for one and gets the next unused voucher, while the wallet is off.


  Starting a book now runs as one setup the app carries through step by
  step: the book, the signatures, each witness connected and provisioned,
  then the issuer. Bundles beignet 0.21.6, which lets channels between two
  beignet wallets be announced; before it a payer could not find a
  witness's channel to the settlement peer.


