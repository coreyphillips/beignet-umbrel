releaseNotes: >-
  The price before the invoice. A lightning-first wallet now asks its
  primary what a just-in-time receive will cost before the invoice is
  created: the Receive tab shows the fee beside the amount, or says why
  the primary cannot fund it right now (not enough on-chain funds, its
  caps, or simply not connected) and holds the Create button until it
  can. Nothing is reserved at the primary by asking.


  Wallets that restore themselves. A wallet using peer storage can now
  come back on its own: import the seed, tick "the previous device is
  stopped", and once its channel peers hand back the encrypted
  checkpoint the wallet installs it, rebuilds without a restart, and
  its channels reconnect where they were. The checkpoint card offers
  the same as a one-click step for wallets that keep the choice manual,
  next to the funds-only recovery that was already there. beignet
  0.11.0 makes the checkpoint fit: before it, a single channel with one
  payment had outgrown the 64 KB peers hold.


  Fees before moves. A lightning-first wallet no longer moves a deposit
  into its channel when the transaction fee would take more than a
  twentieth of it; the Overview says the funds are waiting for the fee
  rate to come down or for more to arrive, and "Move now anyway" lets
  you override for a deposit you want in Lightning at any price.


  beignet 0.11.0 is bundled. The wallet pages, provider cards and
  everything else from 0.14.0 are unchanged.


