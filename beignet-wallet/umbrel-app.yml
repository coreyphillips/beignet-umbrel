releaseNotes: >-
  A wallet can be on-chain only, and change its mind either way. The
  create and import forms gain an 'On-chain only (no Lightning)'
  checkbox, and the Edit dialog gains a Lightning switch that is
  freely reversible because the same seed backs both modes. An
  on-chain only wallet runs no Lightning at all: no listener, no
  dialing out to peers, and a dashboard with the Lightning apparatus
  put away. Turning Lightning off with open channels is allowed and
  warned rather than barred: the channels stay chain-watched, the
  node appears offline to its peers until turned back on, and the
  save button says what it does, 'Save and park N channels'.


  Importing a seed brings its history along. Recovery reads the
  chain and dates recovered transactions to their block time, so an
  imported wallet's Activity reaches back to before the wallet
  existed here, as far as the standard address scan finds use.


  Ships beignet 0.9.0: the engine learns to hold its tongue for
  parked wallets (no more dialing channel partners back), carries
  channel close status and rebroadcast plumbing the dashboard will
  adopt in a coming release, and brings a long run of Lightning
  hardening around splices, dual-funded opens and hostile peer
  input.

