releaseNotes: >-
  Guardians can be rotated. A running wallet in a guardian mode can
  replace one guardian or all three from its Edit dialog, without
  stopping: three slots start as the current set, each takes a guardian
  entry or a beignet node's Lightning address, and one button rotates.
  The wallet registers with the new set, copies its journal across while
  the channels keep running, switches over, and retires the old set for
  good. A seed restore handed the old set follows the rotation to the
  live one on its own, and a previous device still running on the old
  set stops itself the moment it sees the new one. A rotation the wallet
  cannot finish is refused before anything changes.


  The Node status card now says what strict quorum costs. Once a channel
  step has waited for its guardians, the quorum tier reports how many
  steps have been held, the typical wait, the slowest five percent and
  the last one, and any step that timed out. Nothing is estimated; the
  numbers are what this wallet actually paid.


  This bundles beignet 0.13.0.

