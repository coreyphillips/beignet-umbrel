releaseNotes: >-
  A pending transaction the network dropped now shows as dropped in the
  Activity tab instead of waiting for a block for good. That is the losing
  version of a cooperative close whose other version confirmed, a
  transaction replaced by a fee bump, or one every mempool evicted. Its
  details say it will not confirm and that its amount is not in the balance,
  it offers no fee bump, and the new receive notice no longer announces it.
  The manager checks each transaction still pending after two minutes
  against the wallet's own Electrum server. One it cannot check, because the
  server does not answer or is a Tor address, shows as before.


  When a wallet starts, its offline receive return now waits for the
  daemon's event stream, so a plain offline receive book the return closes
  reaches the channel history and the wallet log instead of staying at
  ACTIVE.


  Still bundles beignet 0.37.0, so going back to 0.37.0 is safe: the wallet
  storage is unchanged.
