  - https://raw.githubusercontent.com/coreyphillips/beignet-umbrel/main/beignet-wallet/gallery/3.png
releaseNotes: >-
  Swap providers: the default flat fee for a new provider is now 500 sats
  instead of 0. The engine's quote prices only the funding transaction, so at
  0 every small swap was served at a loss, with the provider paying for its
  own refund transaction; the Edit dialog now says what the flat fee is for.


  Lightning-first wallets: "Move now" reports the dual-funded open it made
  instead of saying the wallet did not answer, a momentary error reading the
  channel list no longer makes the app forget the channel with a previous
  primary, and stopping a wallet while it is still starting now sticks.


  A wallet registry file that cannot be read is copied aside and never
  overwritten, and the app reports itself degraded instead of quietly
  forgetting the other wallets.


  Bundles beignet 0.20.0. The node now enforces the final expiry an invoice
  advertised instead of a fixed 40 blocks, so a swap provider cannot be paid
  with a Lightning payment that expires before its on-chain refund, and held
  invoices report when their payments actually expire. A splice into a
  channel that is already splicing is refused up front and retried by the
  app, instead of being accepted and failing later. Overlapping repeats of
  the same keyed send broadcast once, and a payer can ask the other wallet to
  re-send a receipt that never arrived.

