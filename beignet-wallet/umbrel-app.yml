releaseNotes: >-
  Fixes receiving on a freshly created lightning-first wallet. Version 0.23.0
  sent every lightning-first invoice through the offline-receive path, which
  needs the primary node to settle offline payments, and picking a wallet as a
  primary never turns that on, so the Receive tab could not create an invoice.
  Invoices are created the way they were before: paid over the home channel
  when it has room, otherwise provisioned through the primary just in time,
  with the primary's price shown beside the amount.


  "Receive offline" is now a checkbox on the invoice form for every wallet,
  off by default. Enter at least 354 sats to enable it. On a lightning-first
  wallet the primary prepares the offline invoice, so the primary has to have
  "settle offline receives" turned on in its own settings, plus channel
  funding when a fresh channel is needed; a primary without them says so and
  the ordinary invoice stays a tick away. Bundles beignet 0.21.9.


