releaseNotes: >-
  An offer is payable, and it is paid where invoices are paid.


  Paying a BOLT12 offer published by another Beignet node did not
  work at all. The node issuing the offer asked for a secret that
  BOLT12 gives it no way to send, so every such payment was refused
  with incorrect_or_unknown_payment_details. Offers are now
  authenticated the way the spec intends, and one Beignet node can
  pay another's offer.


  Offers also survive a restart. The previous release noted that
  offers lived in daemon memory, so a restart cleared the list and
  retired anything already shared. That is fixed: an offer you
  publish stays published.


  Offers are paid from the Send tab now, in the same box as
  invoices, rather than from a separate tab. Paste either one. An
  offer naming no amount asks you for one, and the card says why an
  offer shows no fee estimate: an offer is not a destination, it is
  a code that has to be exchanged for an invoice first, and the
  route that invoice comes back with is what a fee would be priced
  over.


  Offers can be deleted. Now that they persist, the list would only
  grow, so each one has a Delete. It asks first, because deleting an
  offer stops every saved copy of that code from working, and a new
  offer is a different code rather than a restored one.


  Ships beignet 0.8.1, which also brings BOLT12 payment correctness
  and routing fixes, on-chain fee estimation fixes, and clearer
  refusals when something you paste cannot be read.

