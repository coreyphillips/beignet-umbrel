  - https://raw.githubusercontent.com/coreyphillips/beignet-umbrel/main/beignet-wallet/gallery/3.png
releaseNotes: >-
  Bundles beignet 0.37.0. A wallet can now rank several primaries for
  receiving and pay an address out of several channels in one transaction,
  through the daemon's new /primaries and /channel-send routes; the
  dashboard does not use them yet. A peer's warnings and payments routed
  through this node that a channel turned away are no longer reported as
  node errors, so they stay out of the error card and the channel history.
  Recovery frames for a busy channel now stay under the guardians' record
  limit, and the network map no longer passes on channel updates marked do
  not forward.


  The dashboard keeps its balance row and cards inside the screen beside
  the wallet sidebar, the Swaps card keeps its Swap size and Fee tiles
  inside the card, the Liquidity provider card sets its four tiles two by
  two when they do not fit, and the Logs tab keeps peer warnings and
  turned-away payments out of the red error card.


  Going back to 0.36.1 keeps the wallet storage, unless a multi-channel
  splice-out is in progress. 0.37.0 adds a table for those, which 0.36.1
  ignores.
dependencies: []
