releaseNotes: >-
  A channel remembers what happened to it.


  Every channel now keeps a durable history: opened, ready, closing,
  closed, and the reason behind an automatic force close, each with a
  timestamp, recorded as it happens and kept across restarts. The
  channel detail view shows the story, so a close that happened while
  nobody was watching can finally explain itself. Recording starts with
  this version, so the history begins now; the record only ever claims
  what was actually observed, and says plainly when it could not be
  loaded or could not be written.


  A closed channel also stops dressing like an open one. Its detail
  view no longer offers a Reconnect button, HTLC slots, a routing
  policy, or routing advice; it shows what the channel was and what
  happened to it. And the wallet list now counts only open channels,
  so a node whose channels have all closed no longer claims them
  forever.


  Ships beignet 0.7.5, unchanged from the previous release.

