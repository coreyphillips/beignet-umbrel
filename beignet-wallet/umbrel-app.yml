  - https://raw.githubusercontent.com/coreyphillips/beignet-umbrel/main/beignet-wallet/gallery/3.png
releaseNotes: >-
  Bundles beignet 0.21.3. Paying a beignet wallet's request as direct funding
  now starts connecting to the recipient the moment the request is pasted, so
  a slow connection over Tor is under way before you press Send, and the two
  minute offer window no longer starts until the offer does. A wallet
  receiving direct funding no longer opens a channel on a coin it could not
  check with its Electrum server, and no longer opens a second channel when
  that check fails.


  The wallet log and the payment card now show each step of a direct
  funding with times: the routes tried and why one was skipped, the offer,
  the recipient's answer and the receipt. A payment that fell back to an
  ordinary transaction keeps its steps in Activity.


  Disconnecting a peer and connecting it again right away now makes a fresh
  connection instead of waiting on the cancelled one, and a hold invoice
  settled or cancelled for only some parts of a multi-part payment keeps the
  remaining parts parked and retries them.

