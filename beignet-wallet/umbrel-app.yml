  - https://raw.githubusercontent.com/coreyphillips/beignet-umbrel/main/beignet-wallet/gallery/2.png
  - https://raw.githubusercontent.com/coreyphillips/beignet-umbrel/main/beignet-wallet/gallery/3.png
releaseNotes: >-
  A wallet's recovery phrase is now shown from its Edit dialog instead of a
  button beside Edit on the wallet's page. Open Edit and press Show recovery
  phrase at the bottom. The warning still comes first, and the words appear
  only when you press Show phrase.


  Closing the phrase takes you back to Edit with your changes still there,
  and Escape now closes only the dialog in front. Still bundles beignet
  0.32.1, so going back to 0.32.4 is safe: the wallet storage is unchanged.
