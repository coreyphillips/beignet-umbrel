releaseNotes: >-
  A Tools tab: prove a message came from your node. Sign any text with
  a wallet's node key and hand out the signature, or verify one from
  anyone else. The format is the LND-compatible one, so it checks out
  under lncli verifymessage and vice versa. Verification names the key
  that signed rather than just saying valid, because a valid signature
  from the wrong key is a valid signature by someone else.


  Money arriving is announced. A payment received over Lightning or
  on-chain shows a notification with the amount, on whichever page of
  the dashboard you are on, backed by a poll so a quietly dead event
  stream cannot silence it. The Receive tab turns a paid invoice into
  a receipt the moment it settles, replacing the QR code: a settled
  invoice cannot be paid twice, so its code invites the one scan
  guaranteed to fail.


  Splice buttons appear only on channels whose peer can splice. The
  daemon reads splice support off each peer's connection, so a channel
  to an LND node stops offering the two buttons LND would refuse every
  time. Close and Reconnect stay.


  The Send tab's Max button works again: pressing it no longer locks
  the form, and with Max on the amount follows the fee slider, so the
  total never exceeds your balance.


  Ships beignet 0.8.2: on-chain arrivals, sends and confirmations are
  announced over the daemon's event stream, and channel listings say
  whether each peer can splice.

