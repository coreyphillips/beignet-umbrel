releaseNotes: >-
  Bundles beignet 0.41.0, and says what Relay only does not cover.


  Reconnects are safer. After a dropped connection a wallet no longer sends
  its peer updates the peer already has. An LND peer answered those with an
  error, and the channel was force closed.


  Invoices and offers follow Lightning's text rules. A description may not
  hold a line break, a tab, an invisible character or an emoji made of
  several joined together (a family, a profession). The dashboard cleans
  what you type before it makes the invoice or offer: line breaks become
  spaces, and a joined emoji shows as its parts side by side. A wallet whose
  name holds such a character keeps working; its Lightning alias leaves
  those characters out. An invoice from elsewhere that breaks these rules
  is refused when you try to pay it, with a message that says why. An offer
  with the amount left empty, or 0, is an offer for any amount.


  Relay only keeps the Iroh phone link on the relay, so the link itself
  does not give away this Umbrel's IP address. The link also carries the
  wallet's Lightning node id, and anything that ties that id to an address
  undoes Relay only from outside the link. The card now warns under the
  link when the wallet announces a public address, and when it is in
  Clearnet or Hybrid mode, where the peers you connect it to see the
  address. The dialog that turns Relay only on lists both, and adds that a
  Lightning port which can be reached from the internet (a router forward,
  or IPv6) lets the node be found without the link. Before handing a link
  out, go through the list in docs/IROH.md. The relay's operator still sees
  the address in every case.


  Also from the engine: a wallet set to Relay only no longer dials out over
  Iroh, because the relay of the peer it dialed would see this Umbrel's
  address (the dashboard never made such a dial). Where the link cannot
  come up because the app's container has no IPv6 loopback address, the
  card names the cause and the setting that restores it. A permanent
  channel failure is now reported with the code Lightning's spec gives it.


  Going back to app 0.40.0 keeps your wallets and channels: it opens the
  same storage and pays as before. It does not have the warnings above, and
  it drops two things this version records: the preimage kept on a
  fulfilled payment for crash recovery, and invoice payment metadata, which
  this app does not use.
