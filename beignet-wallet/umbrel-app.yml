releaseNotes: >-
  Bundles beignet 0.31.1. The Electrum fields now show which servers are
  actually there: each preset (Electrs, Fulcrum, and the rbitcoin app from
  this store) is probed when the fields open and says whether it answered,
  on which chain and at what height. A Test connection button does the same
  for any server you type, such as another Umbrel on your network, and says
  when the TLS box is the wrong way round. A server known to serve another
  chain than the wallet is refused when you save, with a Save anyway button
  if you mean it.


  A wallet can now verify its Electrum server's TLS certificate, by a public
  authority or by a pinned fingerprint. It is off unless you turn it on for a
  TLS server; Test reports the fingerprint it saw so you can pin it.


  From the engine: an idle block no longer rescans the wallet, and an address
  asked for before the first refresh no longer fails. The storage schema moves
  to 19 on the first start, so a wallet with channels must not go back to an
  earlier version of this app. The engine now asks for Node 22.23.4, 24.22.1
  or 26.12.1 and later; this image ships one it accepts.
