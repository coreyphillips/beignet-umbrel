releaseNotes: >-
  Lightning-first wallets. A new kind of wallet with one balance, held
  in a single channel with a primary node: one of your own wallets on
  this Umbrel, or an external beignet node. Bitcoin that lands on its
  deposit address moves into the channel by itself once it confirms,
  invoices are payable before the channel even exists (the primary
  provides the capacity the moment the payment arrives), and sending
  to a bitcoin address spends straight from the channel. Three tabs,
  one figure; an Advanced view shows the rest.


  Direct funding, for every wallet. A deposit request from a
  lightning-first wallet carries a signed request that lets a beignet
  payer fund the recipient's channel in one transaction, with no
  deposit to move afterwards. The Send tab of any wallet offers "Pay
  as direct funding" when it reads such a request, and never pays
  twice: a plain send follows only when the recipient declined before
  anything was signed.


  Liquidity providers. A wallet chosen as an internal primary fronts
  channel funding for its lightning-first wallets from its own
  on-chain balance, within caps you set in its Edit dialog, and its
  Overview shows what it has fronted and what is committed. A primary
  in use cannot be deleted or parked.


  beignet 0.10.0 is bundled: the whole of the lightning-first engine
  work, plus fixes found running this app against real nodes
  (CLN-initiated dual-funded opens now complete, JIT refusals carry
  their reason, a wallet is never locked out of receiving by its own
  unpaid invoices). The wallets page no longer holds an event stream
  per wallet, which had left the page stuck with seven or more
  wallets running.


