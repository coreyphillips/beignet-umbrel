releaseNotes: >-
  Bundles beignet 0.32.1. A mining reward that cannot be spent yet now stays
  out of a wallet's balance until it matures 100 blocks later, so a send no
  longer picks a coin the network would refuse; the reward still shows in
  Activity. Asking for a new address no longer hands back one that was
  already used when a refresh runs at the same moment, or when the Electrum
  server answers only part of the check; in that second case the wallet now
  reports an error instead.


  For Lightning, a channel's short id is no longer recorded wrongly when the
  Electrum server fails a lookup, a channel that fails while its state cannot
  be saved is still force closed, and routes the wallet has learned to avoid
  no longer stall a payment search. Going back to 0.31.0 is safe: the wallet
  storage is unchanged.
