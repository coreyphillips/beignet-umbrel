releaseNotes: >-
  Instant channels between your own wallets.


  Picking one of your own wallets in the Open channel drop-down now
  offers a trusted zero-conf open, on by default: the channel is usable
  the moment its funding transaction broadcasts, with no confirmation
  wait. Each daemon only accepts these opens from peers it has been told
  to trust, and the dashboard arranges that between your wallets for
  you; hand-editing the peer fields turns the option off.


  Trusted channels stay private permanently. Their negotiated channel
  type is never announced to the network, so they are not available for
  general public routing. Splices on them also activate immediately
  instead of waiting for the splice transaction to confirm.


  Also fixes a routing bug where a payment could fail with "no route
  found" on exactly the channel the invoice was pointing at, once that
  channel had been announced to the network.


  Ships beignet 0.7.3.

