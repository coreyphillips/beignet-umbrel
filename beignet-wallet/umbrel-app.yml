  - https://raw.githubusercontent.com/coreyphillips/beignet-umbrel/main/beignet-wallet/gallery/3.png
releaseNotes: >-
  Wallets no longer go quiet for a minute every hour. On a mainnet-sized
  gossip graph, the engine's hourly prune of stale network data deleted
  each row in its own database commit, which held the wallet daemon's
  only thread for the whole pass. The wallet stopped answering, the
  dashboard read it as unhealthy, and its Lightning peers dropped the
  connection on their ping timeout. The prune now does the whole pass in
  one commit.


  Wallets also start faster. That same one-row-at-a-time pass ran during
  startup, before the daemon could accept connections, which is what put
  minutes between starting a wallet and its node coming up.


  This is a bundled engine upgrade to beignet 0.11.1. Nothing in the
  dashboard changes.


